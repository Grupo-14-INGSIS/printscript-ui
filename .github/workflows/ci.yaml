name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Create .env file
        run: |
          echo "VITE_AUTH0_DOMAIN=${{ secrets.VITE_AUTH0_DOMAIN }}" >> .env
          echo "VITE_AUTH0_CLIENT_ID=${{ secrets.VITE_AUTH0_CLIENT_ID }}" >> .env
          echo "VITE_AUTH0_AUDIENCE=${{ secrets.VITE_AUTH0_AUDIENCE }}" >> .env
          echo "VITE_AUTH0_REALM=${{ secrets.VITE_AUTH0_REALM }}" >> .env
          echo "VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}" >> .env

      - name: Build production bundle
        run: npm run build

  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_version: ${{ steps.version.outputs.version }}
      branch: ${{ steps.version.outputs.branch }}
      infra_branch: ${{ steps.version.outputs.infra_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Store new image version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          # Las ramas no se llaman igual: este repo usa develop/production e Infra usa develop/main
          if [[ "$GITHUB_REF_NAME" == "production" ]]; then
          echo "branch=production" >> "$GITHUB_OUTPUT"
          echo "infra_branch=main" >> "$GITHUB_OUTPUT"
          else
          echo "branch=develop" >> "$GITHUB_OUTPUT"
          echo "infra_branch=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/grupo-14-ingsis/printscript-ui:${{ steps.version.outputs.branch }}
            ghcr.io/grupo-14-ingsis/printscript-ui:${{ steps.version.outputs.version }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ secrets.VITE_AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ secrets.VITE_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ secrets.VITE_AUTH0_AUDIENCE }}
            VITE_AUTH0_REALM=${{ secrets.VITE_AUTH0_REALM }}
            VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}

  update-infra:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: Grupo-14-INGSIS/SnippetSearcher-Infrastructure
          ref: ${{ needs.build-and-push.outputs.infra_branch }}
          token: ${{ secrets.PAT }}
          path: infrastructure

      - name: Update image version
        env:
          IMAGE_VERSION: ${{ needs.build-and-push.outputs.image_version }}
          IMAGE: ghcr.io/grupo-14-ingsis/printscript-ui
          BRANCH: ${{ needs.build-and-push.outputs.infra_branch }}
          COMPOSE_FILE: "docker-stack.yml"
        run: |
          set -euo pipefail

          cd infrastructure

          if ! grep -Eq "^[[:space:]]*image:[[:space:]]*${IMAGE}:" "$COMPOSE_FILE"; then
            echo "ERROR: Couldn't find image $IMAGE in $COMPOSE_FILE"
            exit 1
          fi

          sed -i -E \
            "s#(^[[:space:]]*image:[[:space:]]*${IMAGE}:)[^[:space:]]+#\1${IMAGE_VERSION}#" \
            "$COMPOSE_FILE"

          if ! grep -Fq "${IMAGE}:${IMAGE_VERSION}" "$COMPOSE_FILE"; then
            echo "ERROR: Could not successfully update the version"
            exit 1
          fi

          if git diff --quiet -- "$COMPOSE_FILE"; then
            echo "Version was already updated; no changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$COMPOSE_FILE"
          git commit -m "chore: update Docker image ${IMAGE} to ${IMAGE_VERSION}"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"