name: CI/CD

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Imagen ya publicada a desplegar sin compilar.'
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/grupo-14-ingsis/printscript-ui

jobs:
  test:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build   # detecta errores de TypeScript/Vite

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }},${{ env.IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ secrets.VITE_AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ secrets.VITE_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ secrets.VITE_AUTH0_AUDIENCE }}
            VITE_AUTH0_REALM=${{ secrets.VITE_AUTH0_REALM }}
            VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}


  deploy-dev:
    needs: image

    if: >
      always() && github.event_name != 'pull_request' && github.ref_name == 'develop'
      && (needs.image.result == 'success' || inputs.image_tag != '')
    uses: Grupo-14-INGSIS/SnippetSearcher-Infrastructure/.github/workflows/deploy-stack.yml@develop
    with:
      stack: ui
      ambiente: DEV
      image_tag: ${{ inputs.image_tag || format('develop-{0}', github.sha) }}
    secrets: inherit

  deploy-prod:
    needs: image

    if: >
      always() && github.event_name != 'pull_request' && github.ref_name == 'production'
      && (needs.image.result == 'success' || inputs.image_tag != '')
    uses: Grupo-14-INGSIS/SnippetSearcher-Infrastructure/.github/workflows/deploy-stack.yml@main
    with:
      stack: ui
      ambiente: PROD
      image_tag: ${{ inputs.image_tag || format('production-{0}', github.sha) }}
    secrets: inherit